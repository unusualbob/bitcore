[workspace]
members = [
    "crates/bch-schnorr",
    "crates/cwc-crypto",
    "crates/ecdsa",
    "crates/ecies",
    "crates/ed25519",
    "crates/hdkeys",
    "crates/kdfs",
    "crates/merkle",
    "crates/node",
    "crates/secp-context",
    "crates/taproot",
    "crates/xrp-keys",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
zeroize = { version = "=1.8.2", default-features = false }
