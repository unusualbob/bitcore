[package]
name = "bitcore-hdkeys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bitcore-secp-context = { path = "../secp-context" }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
secp256k1 = { version = "=0.31.1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize.workspace = true
