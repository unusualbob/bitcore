[package]
name = "bitcore-kdfs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hmac = { version = "=0.13.0", features = ["zeroize"], default-features = false }
pbkdf2 = { version = "=0.13.0", features = ["hmac"], default-features = false }
scrypt = { version = "=0.12.0", default-features = false }
sha2 = { version = "=0.11.0", features = ["zeroize"], default-features = false }
